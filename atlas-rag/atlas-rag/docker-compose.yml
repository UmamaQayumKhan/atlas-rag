services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant's slim image has no curl, so probe from Python-free shell builtins
      # via its own readiness endpoint over the TCP port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      INDEX_DIR: /app/.atlas_index
      INGEST_ON_BOOT: "true"
    volumes:
      # Mounted so a corpus change does not require an image rebuild.
      - ./data:/app/data:ro
      - atlas_index:/app/.atlas_index
    depends_on:
      qdrant:
        condition: service_healthy

  ui:
    build: .
    restart: unless-stopped
    command: >
      sh -c "pip install --no-cache-dir streamlit>=1.38 &&
             streamlit run /app/ui/app.py --server.port 8501
             --server.address 0.0.0.0 --server.headless true"
    ports:
      - "8501:8501"
    environment:
      ATLAS_API_URL: http://api:8000
    volumes:
      - ./ui:/app/ui:ro
    depends_on:
      - api

volumes:
  qdrant_storage:
  atlas_index:
